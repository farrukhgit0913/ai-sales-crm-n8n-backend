<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Sales CRM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .container {
      width: 100%;
      height: 100vh;
      padding: 22px 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      flex-shrink: 0;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 28px;
      line-height: 1.2;
    }

    .subtitle {
      color: #667085;
      margin: 0;
      font-size: 13px;
    }

    .summary {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .summary-card {
      background: white;
      border-radius: 10px;
      padding: 10px 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
      min-width: 135px;
    }

    .summary-number {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.1;
    }

    .summary-label {
      color: #667085;
      font-size: 11px;
      margin-top: 3px;
    }

    .services {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-rows: minmax(0, 1fr);
      gap: 12px;
    }

    .service {
      min-width: 0;
      background: white;
      border-radius: 11px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
      overflow: hidden;
    }

    .service-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .service-name {
      min-width: 0;
      font-size: 16px;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      flex-shrink: 0;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
    }

    .online {
      background: #dcfce7;
      color: #166534;
    }

    .offline {
      background: #fee2e2;
      color: #991b1b;
    }

    .checking {
      background: #fef3c7;
      color: #92400e;
    }

    .detail {
      margin: 5px 0;
      color: #667085;
      font-size: 11px;
      line-height: 1.35;
      word-break: break-word;
    }

    .detail strong {
      color: #344054;
    }

    .actions {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    button,
    a.button {
      border: 0;
      padding: 8px 13px;
      border-radius: 7px;
      cursor: pointer;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      background: #172033;
      color: white;
    }

    button:hover,
    a.button:hover {
      opacity: .9;
    }

    .last-check {
      margin-top: 8px;
      color: #667085;
      font-size: 10px;
      flex-shrink: 0;
    }

    .error {
      margin-top: 8px;
      padding: 9px 12px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 7px;
      font-size: 11px;
      flex-shrink: 0;
    }

    @media (max-width: 1000px) {
      html,
      body {
        overflow: auto;
      }

      .container {
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }

      .services {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-rows: auto;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 18px;
      }

      .services {
        grid-template-columns: 1fr;
      }

      .summary {
        flex-wrap: wrap;
      }
    }
  </style>

</head>

<body>

<div class="container">

  <header>
    <h1>🤖 AI Sales CRM</h1>
    <p class="subtitle">
      Local AI-powered sales automation environment
    </p>
  </header>

  <div class="summary">

<div class="summary-card">
  <div id="onlineCount" class="summary-number">-</div>
  <div class="summary-label">Services Online</div>
</div>

<div class="summary-card">
  <div id="totalCount" class="summary-number">-</div>
  <div class="summary-label">Total Services</div>
</div>

<div class="summary-card">
  <div id="healthyCount" class="summary-number">-</div>
  <div class="summary-label">Health Checks</div>
</div>

  </div>

  <div id="services" class="services">

<div class="service">
  <div class="service-header">
    <div class="service-name">Checking services...</div>
    <span class="badge checking">CHECKING</span>
  </div>
</div>

  </div>

  <div id="error" class="error" style="display:none;"></div>

  <div class="actions">

<button onclick="loadStatus()">
  ↻ Refresh
</button>

<a class="button" href="/api/health" target="_blank">
  Backend Health
</a>

<a class="button" href="/api/status" target="_blank">
  API Status
</a>

<a class="button" href="http://localhost:5678" target="_blank">
  Open n8n
</a>

<a class="button" href="http://localhost:8025" target="_blank">
  Open Mailpit
</a>

<a class="button" href="http://localhost:11434" target="_blank">
  Ollama
</a>

  </div>

  <div id="lastCheck" class="last-check"></div>

</div>

<script>

const serviceIcons = {
  backend: "🟢",
  mongodb: "🍃",
  n8n: "⚙️",
  sqlite: "🗄️",
  ollama: "🧠",
  qwen3: "✨",
  mailpit: "📧",
  node: "🟩",
  webhook: "🔗",
  aiTest: "🤖",
  emailTest: "✉️"
};

const serviceDescriptions = {
  backend: "Node.js + Express API",
  mongodb: "CRM database",
  n8n: "Workflow automation",
  sqlite: "n8n internal database",
  ollama: "Local AI runtime",
  qwen3: "Local AI model",
  mailpit: "Local email testing",
  node: "JavaScript runtime",
  webhook: "n8n lead webhook",
  aiTest: "Ollama AI generation",
  emailTest: "SMTP → Mailpit test"
};

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function getServiceStatus(service) {
  return service?.status === "online" ||
         service?.status === "connected" ||
         service?.status === "ready" ||
         service?.status === "passed";
}

function renderServices(data) {

  const services = data.services || {};

  const serviceEntries = Object.entries(services);

  const online = serviceEntries.filter(
    ([, service]) => getServiceStatus(service)
  ).length;

  document.getElementById("onlineCount").textContent =
    data.summary?.online ?? online;

  document.getElementById("totalCount").textContent =
    data.summary?.total ?? serviceEntries.length;

  document.getElementById("healthyCount").textContent =
    serviceEntries.filter(
      ([, service]) => getServiceStatus(service)
    ).length;

  const container = document.getElementById("services");

  container.innerHTML = "";

  serviceEntries.forEach(([key, service]) => {

    const isOnline = getServiceStatus(service);

    const card = document.createElement("div");

    card.className = "service";

    let extra = "";

    if (service.url) {
      extra += `
        <div class="detail">
          <strong>URL:</strong>
          ${escapeHtml(service.url)}
        </div>
      `;
    }

    if (service.version) {
      extra += `
        <div class="detail">
          <strong>Version:</strong>
          ${escapeHtml(service.version)}
        </div>
      `;
    }

    if (service.model) {
      extra += `
        <div class="detail">
          <strong>Model:</strong>
          ${escapeHtml(service.model)}
        </div>
      `;
    }

    if (service.database) {
      extra += `
        <div class="detail">
          <strong>Database:</strong>
          ${escapeHtml(service.database)}
        </div>
      `;
    }

    if (service.models?.length) {
      extra += `
        <div class="detail">
          <strong>Models:</strong>
          ${service.models.map(escapeHtml).join(", ")}
        </div>
      `;
    }

    if (service.qwen3Installed !== undefined) {
      extra += `
        <div class="detail">
          <strong>Qwen3:</strong>
          ${service.qwen3Installed ? "Installed ✓" : "Not Installed"}
        </div>
      `;
    }

    if (service.message) {
      extra += `
        <div class="detail">
          ${escapeHtml(service.message)}
        </div>
      `;
    }

    card.innerHTML = `
      <div class="service-header">

        <div class="service-name">
          ${serviceIcons[key] || "🔧"}
          ${escapeHtml(service.name || key)}
        </div>

        <span class="badge ${isOnline ? "online" : "offline"}">
          ${isOnline ? "ONLINE" : "OFFLINE"}
        </span>

      </div>

      <div class="detail">
        <strong>Purpose:</strong>
        ${escapeHtml(serviceDescriptions[key] || service.description || "")}
      </div>

      ${extra}
    `;

    container.appendChild(card);
  });

  const timestamp = data.timestamp
    ? new Date(data.timestamp).toLocaleString()
    : new Date().toLocaleString();

  document.getElementById("lastCheck").textContent =
    `Last checked: ${timestamp} • Auto-refresh every 5 seconds`;
}

async function loadStatus() {

  const errorBox = document.getElementById("error");

  errorBox.style.display = "none";

  try {

    const response = await fetch("/api/status", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();

    renderServices(data);

  } catch (error) {

    errorBox.textContent =
      `Unable to load service status: ${error.message}`;

    errorBox.style.display = "block";

  }
}

loadStatus();

setInterval(loadStatus, 5000);

</script>

</body>
</html>
